[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
via_ir = true
optimizer = true
optimizer_runs = 200
fs_permissions = [
    { access = "write", path = "../../packages/ponder/.env.local"},
    { access = "write", path = "../../packages/web/src/utils/contracts.ts"}
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
